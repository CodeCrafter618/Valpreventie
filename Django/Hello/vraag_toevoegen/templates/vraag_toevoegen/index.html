{% extends 'base.html' %}
{% load static %}
{% block title %}Vraag toevoegen{% endblock %}
{% block extra_head %}
<link rel="stylesheet" href="{% static 'vraag_toevoegen/vraag_toevoegen.css' %}" />
{% endblock %}
{% block content %}
<main class="beheer-wrap">
  <section class="beheer-card" aria-label="Vraag toevoegen">
    <p class="beheer-kicker">Vragenlijst beheer</p>
    <h1>Vraag toevoegen</h1>

    <form method="post" class="toevoeg-form">
      {% csrf_token %}
      <div class="toevoeg-grid">
        <div class="toevoeg-veld">
          <label for="vraag">Titel</label>
          <input
            class="beheer-input"
            type="text"
            id="vraag"
            name="vraag"
            placeholder="Bijvoorbeeld: Controleer je ogen"
            required
          />
        </div>

        <div class="toevoeg-veld">
          <label for="weging">Punten Ja</label>
          <input
            class="beheer-input beheer-input-number"
            type="number"
            id="weging"
            name="weging"
            placeholder="0"
            value="0"
          />
        </div>

        <div class="toevoeg-veld">
          <label for="weging_nee">Punten Nee</label>
          <input
            class="beheer-input beheer-input-number"
            type="number"
            id="weging_nee"
            name="weging_nee"
            placeholder="0"
            value="0"
          />
        </div>

        <div class="toevoeg-veld">
          <label for="extra_info">Beschrijving</label>
          <textarea
            class="beheer-textarea"
            id="extra_info"
            name="extra_info"
            rows="4"
            placeholder="De volledige vraag en tips"
          ></textarea>
        </div>

        <div class="toevoeg-veld">
          <label for="volgorde">#</label>
          <input
            class="beheer-input beheer-input-number"
            type="number"
            id="volgorde"
            name="volgorde"
            value="{{ volgende_volgorde }}"
            min="1"
            aria-label="#"
          />
        </div>

        <div class="toevoeg-actions">
          <button class="actie-btn" type="submit">Toevoegen</button>
          <a href="/vragenlijstbeheer/" class="actie-link">Terug</a>
        </div>
      </div>
    </form>
  </section>
</main>
{% endblock %}
