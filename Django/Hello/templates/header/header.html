{% load static %}
<header class="site-header">
  <div class="site-header__inner">
    <div class="site-header__logo-title">
      <a
        href="/"
        class="site-header__logo-link"
        aria-label="Ga naar de homepagina"
      >
        <img
          src="{% static 'login/Logo.png' %}"
          alt="Logo"
          class="site-header__logo"
          height="32"
        />
      </a>
      {% if request.session.vragenlijst_voltooid %}
      <a href="/resultaat/" class="site-header__nav-link">Resultaat</a>
      {% else %}
      <a href="/vragen/" class="site-header__nav-link">Vragenlijst invullen</a>
      {% endif %} {% if request.user.is_authenticated %}
      <a href="/vragenlijstbeheer/" class="site-header__nav-link"
        >Vragenlijst beheer</a
      >
      {% endif %}
    </div>
    <div class="site-header__login-container">
      {% if request.user.is_authenticated %}
      <form
        action="/login/uitloggen/"
        method="post"
        class="site-header__auth-form"
      >
        {% csrf_token %}
        <button
          type="submit"
          class="site-header__nav-link site-header__login-btn site-header__login-btn--logout"
        >
          Uitloggen
        </button>
      </form>
      {% else %}
      <a href="/login/" class="site-header__nav-link site-header__login-btn"
        >Login</a
      >
      {% endif %}
    </div>
  </div>
</header>
