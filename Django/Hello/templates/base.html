{% load static %}
<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Valpreventie{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'header/header.css' %}" />
    <link rel="stylesheet" href="{% static 'footer/footer.css' %}" />
    <style>
      body {
        margin: 0;
      }

      .site-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .page-content {
        flex: 1;
      }
    </style>
    {% block extra_head %}{% endblock %}
  </head>
  <body class="site-shell">
    {% include 'header/header.html' %}
    <main class="page-content">{% block content %}{% endblock %}</main>
    {% include 'footer/footer.html' %}
  </body>
</html>
