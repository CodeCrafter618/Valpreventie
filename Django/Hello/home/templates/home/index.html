<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f3f4f6;
      }

      .card {
        background: #ffffff;
        border-radius: 14px;
        padding: 24px;
        width: min(92vw, 460px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        text-align: center;
      }

      h1 {
        margin-top: 0;
      }

      .btn {
        border: 0;
        border-radius: 10px;
        background: #1f4fd4;
        color: #fff;
        font-weight: 600;
        padding: 12px 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <section class="card">
      <h1>Je bent ingelogd</h1>
      <p>Welkom op de homepagina.</p>

      <form method="post" action="/login/uitloggen/">
        {% csrf_token %}
        <button class="btn" type="submit">Uitloggen</button>
      </form>
    </section>
  </body>
</html>
